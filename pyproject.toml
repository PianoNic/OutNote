[build-system]
requires = ["uv_build >= 0.11.7, <0.12.0"]
build-backend = "uv_build"

[project]
name = "outnote"
version = "1.3.0"
description = "Headless Microsoft 365 client - mail, calendar, Teams, OneDrive, SharePoint and OneNote over Graph, no app registration."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "PianoNic", email = "contact@pianonic.ch" },
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = [
    "microsoft",
    "microsoft-365",
    "microsoft-graph",
    "graph-api",
    "outlook",
    "onenote",
    "onedrive",
    "sharepoint",
    "teams",
    "mail",
    "calendar",
    "headless",
    "no-app-registration",
    "foci",
    "entra",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "ms-entrance>=1.7",
]

[project.optional-dependencies]
pdf = ["pypdf>=4"]

[project.scripts]
outnote = "outnote._cli:main"

[project.urls]
Homepage = "https://github.com/PianoNic/OutNote"
Issues = "https://github.com/PianoNic/OutNote/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.6",
]

[tool.uv.build-backend]
module-name = "outnote"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E731", "B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["src/outnote"]
