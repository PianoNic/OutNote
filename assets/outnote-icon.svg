<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- three fixed Microsoft panes -->
  <rect x="9" y="9" width="22" height="22" rx="3" fill="#F25022"/>
  <rect x="9" y="33" width="22" height="22" rx="3" fill="#00A4EF"/>
  <rect x="33" y="33" width="22" height="22" rx="3" fill="#FFB900"/>
  <!-- dashed socket the note was pulled from (the 4th pane's slot) -->
  <rect x="33" y="9" width="22" height="22" rx="3" fill="none" stroke="#9aa0a6"
        stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>
  <!-- the extracted note, lifted up and out of that slot -->
  <rect x="37" y="5" width="22" height="22" rx="3" fill="#ffffff" stroke="#7719AA" stroke-width="3"/>
  <rect x="41" y="11" width="13" height="2.5" rx="1.25" fill="#7719AA"/>
  <rect x="41" y="16" width="14" height="2.5" rx="1.25" fill="#9aa0a6"/>
  <rect x="41" y="21" width="9"  height="2.5" rx="1.25" fill="#9aa0a6"/>
</svg>
